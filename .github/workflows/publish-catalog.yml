name: Legacy catalog publish (manual only)

# Retained for explicitly authorised historical catalogue operations only.
# Current restricted npm releases use publish-npm.yml and docs/npm-distribution.md.
# The reusable catalogue workflow preserves its opt-in, token and dry-run gates.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (do not POST to catalog)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    uses: OrgSDK/plugins/.github/workflows/plugin-publish.yml@d40b6cefa239e9012df9dbb6a8ef6f488578ceb9
    with:
      # Honour the manual dry_run choice; the reusable workflow rechecks opt-in.
      dry-run: ${{ github.event.inputs.dry_run != 'false' }}
      publish-enabled: ${{ vars.ORGSDK_ENABLE_CATALOG_PUBLISH }}
      catalog-url: ${{ vars.ORGSDK_CATALOG_URL }}
      artifact-name: plugin-twitter-${{ github.sha }}
    secrets:
      ORGSDK_PUBLISH_TOKEN: ${{ secrets.ORGSDK_PUBLISH_TOKEN }}
