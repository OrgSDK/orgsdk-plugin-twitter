name: CI

# Delegates to the centrally maintained reusable CI workflow in OrgSDK/plugins.
# That workflow runs in THIS repo's context (caller checkout, caller
# GITHUB_TOKEN) and only invokes the npm scripts below + the orgsdk-plugin CLI.
# See https://github.com/OrgSDK/plugins/blob/main/docs/reusable-workflows.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: OrgSDK/plugins/.github/workflows/plugin-ci.yml@c5296ffdc31e567a0ae3dd32a25594702995d839
    with:
      artifact-name: plugin-twitter-${{ github.sha }}
